<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tn_490</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #080808; --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08); --text: #e8e8e8;
      --muted: rgba(255,255,255,0.35); --accent: #c8a96e;
      --font: 'Space Grotesk', sans-serif;
    }
    html, body { height: 100%; }
    body { background: var(--black); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; position: relative; }
    .bg { position: fixed; inset: 0; background-image: url('bg.png'); background-size: cover; background-position: center top; opacity: 0.15; z-index: 0; }
    .bg::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: linear-gradient(to bottom, transparent, var(--black)); }
    .grain { position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E"); opacity: 0.03; pointer-events: none; z-index: 1; }
    #public-page { position: relative; z-index: 2; width: 100%; max-width: 420px; padding: 0 24px 64px; display: flex; flex-direction: column; align-items: center; }
    .header-image { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: left top; display: block; mask-image: linear-gradient(to bottom, black 60%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%); }
    .header { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: -48px; padding-bottom: 4px; }
    .name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #fff; text-align: center; }
    .socials { display: flex; gap: 22px; margin-top: 20px; align-items: center; }
    .social-link { color: var(--muted); transition: color 0.2s ease; display: flex; align-items: center; justify-content: center; }
    .social-link:hover { color: #fff; }
    .social-link svg { width: 17px; height: 17px; fill: currentColor; }
    .divider { width: 100%; height: 1px; background: var(--border); margin: 32px 0 26px; }
    .links { width: 100%; display: flex; flex-direction: column; gap: 9px; }
    .section-label { width: 100%; font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .link-item { display: flex; align-items: center; justify-content: space-between; padding: 17px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 3px; text-decoration: none; color: var(--text); font-size: 13px; font-weight: 500; letter-spacing: 0.03em; text-transform: lowercase; transition: border-color 0.2s ease, background 0.2s ease; position: relative; overflow: hidden; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; }
    .link-item::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: 0; transition: opacity 0.2s ease; }
    .link-item:hover { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.07); }
    .link-item:hover::before { opacity: 1; }
    .link-label { flex: 1; }
    .link-badge { font-size: 9px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(200,169,110,0.3); padding: 3px 8px; border-radius: 2px; margin-left: 12px; white-space: nowrap; }
    .link-arrow { color: var(--muted); margin-left: 12px; font-size: 15px; transition: transform 0.2s ease, color 0.2s ease; }
    .link-item:hover .link-arrow { transform: translateX(3px); color: var(--text); }
    .footer { margin-top: 52px; font-size: 10px; letter-spacing: 0.12em; color: rgba(255,255,255,0.15); text-transform: lowercase; }
    @media (prefers-reduced-motion: no-preference) {
      #public-page { animation: fadeUp 0.5s ease both; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    }
    #admin-login, #admin-panel { display: none; position: fixed; inset: 0; z-index: 999; background: #080808; overflow-y: auto; font-family: var(--font); }
    #admin-login { align-items: center; justify-content: center; flex-direction: column; }
    .admin-login-box { background: #111; border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 40px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }
    .admin-login-box h2 { font-size: 16px; font-weight: 600; color: #fff; }
    .admin-login-box p { font-size: 11px; color: var(--muted); }
    .a-input { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 3px; padding: 12px 14px; color: #fff; font-family: var(--font); font-size: 13px; width: 100%; outline: none; }
    .a-input:focus { border-color: var(--accent); }
    .a-btn { background: var(--accent); color: #080808; border: none; border-radius: 3px; padding: 12px 20px; font-family: var(--font); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s; }
    .a-btn:hover { opacity: 0.85; }
    .a-btn-ghost { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.1); border-radius: 3px; padding: 10px 16px; font-family: var(--font); font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; }
    .a-btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
    .a-btn-danger { background: transparent; color: #e05555; border: 1px solid rgba(224,85,85,0.3); border-radius: 3px; padding: 8px 14px; font-family: var(--font); font-size: 11px; font-weight: 500; cursor: pointer; }
    .login-error { font-size: 11px; color: #e05555; display: none; }
    #admin-panel { padding: 0; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; border-bottom: 1px solid rgba(255,255,255,0.07); position: sticky; top: 0; background: #080808; z-index: 10; }
    .admin-header h1 { font-size: 14px; font-weight: 600; color: #fff; }
    .admin-header span { font-size: 10px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
    .admin-body { max-width: 800px; margin: 0 auto; padding: 32px 28px 80px; display: flex; flex-direction: column; gap: 32px; }
    .admin-section { display: flex; flex-direction: column; gap: 14px; }
    .admin-section-title { font-size: 9px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .link-editor-list { display: flex; flex-direction: column; gap: 10px; }
    .link-editor-row { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 10px; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; padding: 14px; }
    .link-editor-row input { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 3px; padding: 9px 12px; color: #fff; font-family: var(--font); font-size: 12px; outline: none; width: 100%; }
    .link-editor-row input:focus { border-color: var(--accent); }
    .badge-toggle { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .badge-toggle input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }
    .add-link-row { display: flex; gap: 10px; }
    .add-link-row input { flex: 1; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 3px; padding: 10px 12px; color: #fff; font-family: var(--font); font-size: 12px; outline: none; }
    .save-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f0f0f; border-top: 1px solid rgba(255,255,255,0.07); padding: 16px 28px; display: none; align-items: center; justify-content: space-between; z-index: 20; }
    .save-bar.visible { display: flex; }
    .save-bar p { font-size: 11px; color: var(--muted); }
    .save-note { font-size: 10px; color: var(--muted); margin-top: 8px; }
  </style>
</head>

  <div id="admin-login">
    <div class="admin-login-box">
      <h2>admin</h2>
      <p>tn490.com — backend access</p>
      <input class="a-input" type="password" id="pw-input" placeholder="password" />
      <p class="login-error" id="login-error">wrong password</p>
      <button class="a-btn" onclick="doLogin()">enter</button>
    </div>
  </div>

  <div id="admin-panel">
    <div class="admin-header">
      <h1>tn_490 <span>admin</span></h1>
      <div style="display:flex;gap:10px;">
        <button class="a-btn-ghost" onclick="window.location='/'">view site</button>
        <button class="a-btn-ghost" onclick="logout()">logout</button>
      </div>
    </div>
    <div class="admin-body">
      <div class="admin-section">
        <div class="admin-section-title">edit links</div>
        <div class="link-editor-list" id="link-editor-list"></div>
        <div style="margin-top:16px;">
          <div class="admin-section-title" style="margin-bottom:12px;">add new link</div>
          <div class="add-link-row">
            <input id="new-label" placeholder="label" />
            <input id="new-url" placeholder="https://" />
            <button class="a-btn" onclick="addLink()">add</button>
          </div>
        </div>
        <p class="save-note">saving pushes to github — site updates for everyone in ~30 seconds</p>
      </div>
    </div>
    <div class="save-bar" id="save-bar">
      <p id="save-status">you have unsaved changes</p>
      <button class="a-btn" onclick="saveLinks()">save — go live</button>
    </div>
  </div>

  <script>
    const ADMIN_PW = 'tn490admin';
    const REPO = 'sith490/tn490sith';
    const FILE_PATH = 'public/links.json';

    let editLinks = [];

    async function getToken() {
      const r = await fetch('/api/token');
      const d = await r.json();
      return d.token;
    }

    async function renderPublic() {
      try {
        const r = await fetch('/links.json?v=' + Date.now());
        const links = await r.json();
        const container = document.getElementById('links-container');
        container.innerHTML = '';
        links.forEach((l, i) => {
          if (i === 0) { const lbl = document.createElement('div'); lbl.className = 'section-label'; lbl.textContent = 'new project'; container.appendChild(lbl); }
          if (i === 1) { const lbl = document.createElement('div'); lbl.className = 'section-label'; lbl.style.marginTop = '20px'; lbl.textContent = 'catalogue'; container.appendChild(lbl); }
          const a = document.createElement('div');
          a.className = 'link-item';
          a.onclick = () => window.open(l.url, '_blank', 'noopener');
          a.innerHTML = `<span class="link-label">${l.label}</span>${l.badge ? `<span class="link-badge">${l.badge}</span>` : ''}<span class="link-arrow">→</span>`;
          container.appendChild(a);
        });
      } catch(e) { console.error(e); }
    }

    function isAdmin() { return sessionStorage.getItem('tn_auth') === '1'; }
    function doLogin() {
      if (document.getElementById('pw-input').value === ADMIN_PW) {
        sessionStorage.setItem('tn_auth', '1'); showAdmin();
      } else { document.getElementById('login-error').style.display = 'block'; }
    }
    document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    function logout() { sessionStorage.removeItem('tn_auth'); window.location = '/'; }

    async function showAdmin() {
      document.getElementById('admin-login').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      const r = await fetch('/links.json?v=' + Date.now());
      editLinks = await r.json();
      renderLinkEditor();
    }

    function renderLinkEditor() {
      const list = document.getElementById('link-editor-list');
      list.innerHTML = '';
      editLinks.forEach((l, i) => {
        const row = document.createElement('div');
        row.className = 'link-editor-row';
        row.innerHTML = `
          <input value="${l.label}" placeholder="label" oninput="editLinks[${i}].label=this.value;markDirty()" />
          <input value="${l.url}" placeholder="url" oninput="editLinks[${i}].url=this.value;markDirty()" />
          <label class="badge-toggle"><input type="checkbox" ${l.badge ? 'checked' : ''} onchange="editLinks[${i}].badge=this.checked?'EP':'';markDirty()" /> EP</label>
          <button class="a-btn-danger" onclick="removeLink(${i})">✕</button>
        `;
        list.appendChild(row);
      });
    }

    function markDirty() { document.getElementById('save-bar').classList.add('visible'); }
    function addLink() {
      const label = document.getElementById('new-label').value.trim();
      const url = document.getElementById('new-url').value.trim();
      if (!label || !url) return;
      editLinks.push({ label, url, badge: '' });
      document.getElementById('new-label').value = '';
      document.getElementById('new-url').value = '';
      markDirty(); renderLinkEditor();
    }
    function removeLink(i) { editLinks.splice(i, 1); markDirty(); renderLinkEditor(); }

    async function saveLinks() {
      const btn = document.querySelector('#save-bar .a-btn');
      btn.textContent = 'saving...';
      try {
        const token = await getToken();
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(editLinks, null, 2))));
        const getRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json' }
        });
        const getData = await getRes.json();
        const putRes = await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'update links', content, sha: getData.sha })
        });
        if (putRes.ok) {
          document.getElementById('save-bar').classList.remove('visible');
          btn.textContent = 'save — go live';
          alert('✓ saved — site updates in ~30 seconds');
        } else {
          const err = await putRes.json();
          alert('error: ' + err.message);
          btn.textContent = 'save — go live';
        }
      } catch(e) {
        alert('failed: ' + e.message);
        btn.textContent = 'save — go live';
      }
    }

    if (location.hash === '#admin') {
      if (isAdmin()) { showAdmin(); }
      else { document.getElementById('admin-login').style.display = 'flex'; }
    } else {
      renderPublic();
    }
  </script>
</body>
</html>
